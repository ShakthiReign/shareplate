spring.application.name=shareplate

server.port=8080

# DATABASE
spring.datasource.url=${SHAREPLATE_DB_URL:jdbc:postgresql://localhost:5432/shareplate}
spring.datasource.username=${SHAREPLATE_DB_USERNAME}
spring.datasource.password=${SHAREPLATE_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
shareplate.jwt.secret=${SHAREPLATE_JWT_SECRET}
shareplate.jwt.expiration-ms=86400000

# EMAIL
spring.mail.host=${SHAREPLATE_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SHAREPLATE_MAIL_PORT:465}
spring.mail.username=${SHAREPLATE_MAIL_USERNAME}
spring.mail.password=${SHAREPLATE_MAIL_PASSWORD}

# SMTP SSL & TIMEOUT SETTINGS
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

shareplate.mail.from=${SHAREPLATE_MAIL_FROM:${SHAREPLATE_MAIL_USERNAME}}

# FRONTEND
shareplate.frontend-url=${SHAREPLATE_FRONTEND_URL:https://shareplate-green.vercel.app}
